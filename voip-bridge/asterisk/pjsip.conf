;==============================================================================
; AW Digital OS — Asterisk WebRTC↔SIP-Brücke (Vapi-Nachbau)
;------------------------------------------------------------------------------
; Diese Datei tut, was Vapi tut: sie registriert die easybell **Cloud-PBX**
; (pbx.easybell.de — die Telefonanlage, NICHT den SIP-Trunk voip.easybell.de)
; und bietet dem Browser-Dialer (jssip) einen sicheren WebRTC-Endpunkt über
; WSS. Der Browser spricht WebRTC, easybell spricht SIP — Asterisk übersetzt.
;
; LEKTION 14.06.2026: Registrierung am SIP-Trunk voip.easybell.de wird mit 401
; abgelehnt. Der richtige Weg ist die Cloud-PBX pbx.easybell.de mit dem
; CPBX-Gerätebenutzer. easybell erlaubt nur EINE Cloud-PBX-Geräteregistrierung
; gleichzeitig — keine zweite Brücke parallel laufen lassen (sonst Flapping).
;
; >>> VOR DEM DEPLOY DIE 2 PASSWÖRTER (CHANGE_ME) SETZEN <<<
; Werte für diesen Deploy: VPS 187.124.190.135, Cloud-PBX-User
; CPBX-g36sfsb0-000000. Passwörter stehen in der Prod-.env / im Passwort-Tresor,
; NICHT im Repo.
;==============================================================================

;--- Transporte -----------------------------------------------------------
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0
; Öffentliche IP des VPS — wichtig für NAT/Medien (RTP):
external_media_address=187.124.190.135
external_signaling_address=187.124.190.135

[transport-wss]
type=transport
protocol=wss
bind=0.0.0.0:8089

;==============================================================================
; 1) easybell Cloud-PBX  (ausgehend ins öffentliche Netz)
;==============================================================================
[easybell_auth]
type=auth
auth_type=userpass
username=CPBX-g36sfsb0-000000          ; easybell Cloud-PBX-Gerätebenutzer
password=CHANGE_ME

[easybell_aor]
type=aor
contact=sip:pbx.easybell.de

[easybell_reg]
type=registration
transport=transport-udp
outbound_auth=easybell_auth
server_uri=sip:pbx.easybell.de
client_uri=sip:CPBX-g36sfsb0-000000@pbx.easybell.de
retry_interval=60
forbidden_retry_interval=300
expiration=600
line=yes
endpoint=easybell

[easybell]
type=endpoint
transport=transport-udp
context=from-easybell
disallow=all
allow=alaw,ulaw,g722
outbound_auth=easybell_auth
aors=easybell_aor
from_user=CPBX-g36sfsb0-000000         ; Caller-ID-Quelle = Cloud-PBX-Gerät
from_domain=pbx.easybell.de
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

[easybell_identify]
type=identify
endpoint=easybell
match=pbx.easybell.de

;==============================================================================
; 2) BROWSER-SOFTPHONE  (das Cockpit, via WebRTC/WSS)
;==============================================================================
[webrtc_auth]
type=auth
auth_type=userpass
username=cockpit
password=CHANGE_ME        ; frei wählbar, kommt auch ins Cockpit (ASTERISK_SIP_PASSWORD)

[cockpit]
type=aor
max_contacts=1
remove_existing=yes

[cockpit]
type=endpoint
transport=transport-wss
context=from-internal
disallow=all
allow=opus,alaw,ulaw
auth=webrtc_auth
aors=cockpit
; webrtc=yes setzt automatisch: DTLS-SRTP, ICE, rtcp_mux, use_avpf, bundle …
webrtc=yes
