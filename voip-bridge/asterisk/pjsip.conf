;==============================================================================
; AW Digital OS — Asterisk WebRTC↔SIP-Brücke (Vapi-Nachbau)
;------------------------------------------------------------------------------
; Diese Datei tut, was Vapi tut: sie registriert deinen easybell-SIP-TRUNK
; (voip.easybell.de — die direkte Leitung ins öffentliche Netz, NICHT die
; Cloud Telefonanlage) und bietet dem Browser-Dialer (jssip) einen sicheren
; WebRTC-Endpunkt über WSS. Der Browser spricht WebRTC, easybell spricht SIP —
; Asterisk übersetzt dazwischen.
;
; >>> VOR DEM DEPLOY DIE 4 WERTE MIT "CHANGE_ME" ERSETZEN <<<
;==============================================================================

;--- Transporte -----------------------------------------------------------
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0
; Öffentliche IP deines VPS — wichtig für NAT/Medien (RTP):
external_media_address=CHANGE_ME_PUBLIC_IP
external_signaling_address=CHANGE_ME_PUBLIC_IP

[transport-wss]
type=transport
protocol=wss
bind=0.0.0.0:8089

;==============================================================================
; 1) easybell-TRUNK  (ausgehend ins öffentliche Netz)
;==============================================================================
[easybell_auth]
type=auth
auth_type=userpass
username=CHANGE_ME_EASYBELL_USER          ; z.B. 004967121546601
password=CHANGE_ME_EASYBELL_PASSWORD      ; dein Trunk-SIP-Passwort

[easybell_aor]
type=aor
contact=sip:voip.easybell.de

[easybell_reg]
type=registration
transport=transport-udp
outbound_auth=easybell_auth
server_uri=sip:voip.easybell.de
client_uri=sip:CHANGE_ME_EASYBELL_USER@voip.easybell.de
retry_interval=60
forbidden_retry_interval=300
expiration=600
line=yes
endpoint=easybell

[easybell]
type=endpoint
transport=transport-udp
context=from-easybell
disallow=all
allow=alaw,ulaw,g722
outbound_auth=easybell_auth
aors=easybell_aor
from_user=CHANGE_ME_EASYBELL_USER         ; Caller-ID = deine easybell-Nummer
from_domain=voip.easybell.de
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

[easybell_identify]
type=identify
endpoint=easybell
match=voip.easybell.de

;==============================================================================
; 2) BROWSER-SOFTPHONE  (das Cockpit, via WebRTC/WSS)
;==============================================================================
[webrtc_auth]
type=auth
auth_type=userpass
username=cockpit
password=CHANGE_ME_WEBRTC_PASSWORD        ; frei wählbar, kommt auch ins Cockpit (.env.local)

[cockpit]
type=aor
max_contacts=1
remove_existing=yes

[cockpit]
type=endpoint
transport=transport-wss
context=from-internal
disallow=all
allow=opus,alaw,ulaw
auth=webrtc_auth
aors=cockpit
; webrtc=yes setzt automatisch: DTLS-SRTP, ICE, rtcp_mux, use_avpf, bundle …
webrtc=yes
