;==============================================================================
; AW Digital OS — Dialplan (Routing-Logik der Brücke)
;==============================================================================

[globals]

;--- Ausgehend: Browser wählt eine Nummer → raus über den easybell-Trunk -----
[from-internal]
; Normalisierung: führendes "+" → "00" (E.164 international), damit easybell
; die Nummer akzeptiert. Nationale 0-Nummern (0163…) gehen direkt durch.
exten => _+X.,1,Goto(from-internal,00${EXTEN:1},1)

exten => _X.,1,NoOp(Cockpit ruft raus: ${EXTEN} via easybell)
 same => n,Set(CALLERID(num)=CHANGE_ME_EASYBELL_CLIP)   ; z.B. 4967121546601
 same => n,Dial(PJSIP/${EXTEN}@easybell,60)
 same => n,Hangup()

;--- Eingehend: Anruf von easybell → klingelt im Browser-Cockpit -------------
[from-easybell]
exten => _X.,1,NoOp(Eingehender Anruf → Cockpit)
 same => n,Dial(PJSIP/webrtc,30)
 same => n,Hangup()

; Fängt Anrufe ab, bei denen easybell die Zielnummer als "s" oder leer schickt:
exten => s,1,NoOp(Eingehender Anruf (s) → Cockpit)
 same => n,Dial(PJSIP/webrtc,30)
 same => n,Hangup()
