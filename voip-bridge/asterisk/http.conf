;==============================================================================
; Asterisk HTTP/WebSocket-Server — liefert den WSS-Endpunkt für den Browser.
; Der Browser-Dialer verbindet sich gegen  wss://DEINE-DOMAIN:8089/ws
;==============================================================================
[general]
enabled=yes
bindaddr=0.0.0.0
bindport=8088

; TLS (Pflicht für WebRTC im Browser):
tlsenable=yes
tlsbindaddr=0.0.0.0:8089
; Let's-Encrypt-Zertifikate (siehe README — werden in den Container gemountet):
tlscertfile=/etc/asterisk/keys/fullchain.pem
tlsprivatekey=/etc/asterisk/keys/privkey.pem
