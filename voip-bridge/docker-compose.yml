# AW Digital OS — Asterisk WebRTC↔SIP-Brücke
# Start:  docker compose up -d
# Logs:   docker compose logs -f
# Konsole: docker compose exec asterisk asterisk -rvvv
#
# network_mode: host ist auf einem Linux-VPS der einfachste Weg, damit RTP
# (Sprache) sauber durchläuft — kein Port-Mapping-Theater.
services:
  asterisk:
    image: andrius/asterisk:latest
    container_name: aw-voip-bridge
    network_mode: host
    restart: unless-stopped
    volumes:
      # Unsere Konfig:
      - ./asterisk/pjsip.conf:/etc/asterisk/pjsip.conf:ro
      - ./asterisk/extensions.conf:/etc/asterisk/extensions.conf:ro
      - ./asterisk/http.conf:/etc/asterisk/http.conf:ro
      - ./asterisk/rtp.conf:/etc/asterisk/rtp.conf:ro
      # Let's-Encrypt-Zertifikate: NICHT direkt aus /etc/letsencrypt mounten —
      # der Container läuft non-root und bekommt sonst "Permission denied" auf
      # den privkey, dann bindet TLS nicht auf 8089. Stattdessen Certs nach
      # /opt/aw-voip/keys/ kopieren (chmod 644) und von dort mounten. Ein
      # certbot deploy-hook (/etc/letsencrypt/renewal-hooks/deploy/aw-voip.sh)
      # kopiert sie bei jeder Erneuerung neu dorthin.
      - /opt/aw-voip/keys/fullchain.pem:/etc/asterisk/keys/fullchain.pem:ro
      - /opt/aw-voip/keys/privkey.pem:/etc/asterisk/keys/privkey.pem:ro
