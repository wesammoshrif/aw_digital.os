name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      # Reproduzierbare Installation aus dem Lockfile.
      - run: npm ci
      # Lint ist beratend (vorbestehende Alt-Schulden brechen die Pipeline nicht).
      - run: npm run lint
        continue-on-error: true
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_DB_CONNECTED: "true"
          NEXT_TELEMETRY_DISABLED: "1"

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Beratend: meldet Vulns als Annotation, bricht aber die Pipeline nicht.
      # Die verbleibende High-Vuln (undici) ist transitiv über Next.js und wird
      # mit dem nächsten Next-Update gelöst — kein lokaler Fix ohne Lockfile-
      # Plattformbruch möglich. Neue High-Vulns bitte hier im Log beachten.
      - run: npm audit --audit-level=high
        continue-on-error: true
