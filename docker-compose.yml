# AW Digital OS — Self-Host auf dem VPS (Docker)
# Start:  docker compose up -d --build
# Secrets liegen in einer .env NEBEN dieser Datei (NICHT committen!) —
# siehe .env.example für die Liste, DEPLOY.md für die Anleitung.

# Log-Rotation: ohne das wachsen die Container-Logs UNBEGRENZT und füllen
# irgendwann die VPS-Platte. Max 10 MB × 3 Dateien pro Container = Deckel.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ── Next.js-App (nur intern, Caddy macht den Public-Zugang) ──
  app:
    build:
      context: .
      args:
        # Ins Browser-Bundle gebacken → muss beim Build true sein.
        NEXT_PUBLIC_DB_CONNECTED: "true"
    image: aw-digital-os:latest
    restart: unless-stopped
    env_file: .env # DATABASE_URL, NEXT_PUBLIC_SUPABASE_*, ASTERISK_*, ANTHROPIC_API_KEY, …
    expose:
      - "3000"
    logging: *default-logging

  # ── Caddy: Reverse-Proxy + automatisches HTTPS (Let's Encrypt) ──
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    logging: *default-logging

  # ── Cron-Sidecar: ruft stündlich /api/cron/tick (Termin-Erinnerungen) ──
  cron:
    image: alpine:3
    restart: unless-stopped
    env_file: .env # liest CRON_SECRET
    depends_on:
      - app
    logging: *default-logging
    command:
      - sh
      - -c
      - |
        apk add --no-cache curl >/dev/null 2>&1
        echo "[cron] gestartet — Tick jede Stunde"
        while true; do
          sleep 3600
          curl -s -m 30 -X POST -H "x-cron-secret: $$CRON_SECRET" \
            http://app:3000/api/cron/tick >/dev/null 2>&1 || true
        done

volumes:
  caddy_data:
  caddy_config:
