# AW Digital OS — System-Nginx-vhost auf dem VPS (NEBEN dem Kontaktformular-vhost).
# Reverse-Proxy auf den Docker-Container, der nur lokal auf 127.0.0.1:3000 lauscht.
#
# Ablage:  /etc/nginx/sites-available/os-awcode  → symlink nach sites-enabled/
# TLS:     certbot --nginx -d os.awcode.de  ergänzt die 443-/SSL-Zeilen
#          und den 80→443-Redirect automatisch (wie bei api.moshrifmontagebau.online).

server {
    listen 80;
    listen [::]:80;
    server_name os.awcode.de;

    # Audit-/Import-Payloads können größer sein als das 1m-Default.
    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Der Souffleur streamt den Diktat-Satz Token für Token (chunked HTTP).
        # Ohne abgeschaltetes Buffering würde Nginx den Stream sammeln → kein
        # Live-Effekt. read/send-Timeout hoch für lange Streams/Audits.
        proxy_buffering    off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
